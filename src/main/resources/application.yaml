server:
  port: 8083

spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: autosentry-kafka:9092

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      enable-auto-commit: true

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "com.autosentry.*"
        spring.json.value.default.type: com.autosentry.notification_service.event.VehicleExpiryEvent
        spring.json.use.type.headers: false

        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
        max.poll.interval.ms: 300000

    listener:
      missing-topics-fatal: false
      ack-mode: record
      concurrency: 1

  mail:
    host: ${SPRING_MAIL_HOST:mailhog}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/

logging:
  level:
    org.springframework.kafka.listener.KafkaMessageListenerContainer: DEBUG
    org.springframework.kafka.listener.KafkaMessageListenerContainer$ListenerConsumer: DEBUG
    org.apache.kafka.clients.consumer.internals: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
